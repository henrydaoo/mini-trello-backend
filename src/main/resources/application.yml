spring:
  application:
    name: mini-trello-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/mini_trello
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:this-is-a-secret-key}
  expiration-ms: 86400000   # 24h

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.minitrello: DEBUG
    org.hibernate.SQL: DEBUG